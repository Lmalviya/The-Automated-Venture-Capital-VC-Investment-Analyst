[project]
name = "vc-analyst-service"
version = "0.1.0"
description = "FastAPI Wrapper for the VC Investment Analyst Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "httpx>=0.27.0",
    "pymupdf>=1.24.0",
    "beautifulsoup4>=4.12.0",
    "openai>=1.14.0",
    "structlog>=25.5.0",
    "python-pptx>=1.0.2",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langgraph>=0.1.0",
    "langchain-openai>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vs_analyst"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

