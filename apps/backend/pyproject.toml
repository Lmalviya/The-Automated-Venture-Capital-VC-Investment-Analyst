[project]
name = "vc-backend-gateway"
version = "0.1.0"
description = "FastAPI REST API Gateway and Upload Router"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
