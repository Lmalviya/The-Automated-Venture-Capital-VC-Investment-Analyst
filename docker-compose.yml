services:
  minio:
    image: minio/minio:latest
    container_name: vc-minio
    ports:
      - "9000:9000" # S3 API endpoint
      - "9001:9001" # S3 Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - vc-analyst-network

  ui:
    build:
      context: ./apps/ui
      dockerfile: Dockerfile
    container_name: vc-ui
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - vc-analyst-network

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: vc-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ENDPOINT_URL_EXTERNAL=http://localhost:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadminpassword
      - S3_BUCKET_NAME=vc-analyst-decks
      - ANALYST_SERVICE_URL=http://analyst:8001
    depends_on:
      - minio
    networks:
      - vc-analyst-network

  analyst:
    build:
      context: ./apps/analyst
      dockerfile: Dockerfile
    container_name: vc-analyst
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_ACCESS_KEY=minioadmin
      - STORAGE_SECRET_KEY=minioadminpassword
      - STORAGE_BUCKET=vc-analyst-decks
      - STORAGE_REGION=us-east-1
      - POSTGRES_HOST=postgres
      - SEARXNG_URL=http://searxng:8080
    depends_on:
      - minio
      - postgres
    volumes:
      - ./outputs:/app/outputs
    networks:
      - vc-analyst-network

  redis:
      image: redis:7-alpine
      container_name: redis
      restart: unless-stopped
      ports:
        - "6379:6379"
      command: >
        redis-server
        --appendonly yes
        --save 60 1000
        --loglevel warning
      volumes:
        - redis_data:/data
      networks:
        - vc-analyst-network
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 10s
        timeout: 5s
        retries: 5

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - BASE_URL=http://localhost:8080/
      - INSTANCE_NAME=MySearxNG
      - SEARXNG_REDIS_URL=redis://redis:6379/0
    # environment:
    #   - SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml
    networks:
      - vc-analyst-network
    depends_on:
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: vc-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: vc_analyst
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vc-analyst-network
    restart: always

volumes:
  minio_data:
  postgres_data:
  redis_data:

networks:
  vc-analyst-network:
    driver: bridge
