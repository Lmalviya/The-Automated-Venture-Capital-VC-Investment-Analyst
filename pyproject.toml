[project]
name = "vs-analyst"
version = "0.1.0"
description = "Automated Venture Capital (VC) Investment Analyst Pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",       # Required for typed input/output schemas
    "pymupdf>=1.24.0",       # For the pdf_extractor tool
    "httpx>=0.27.0",         # Async HTTP client for page_fetcher and web_search
    "beautifulsoup4>=4.12.0",# For website_scraper HTML parsing
    "openai>=1.14.0",        # For your LLM tools (change to your preferred provider)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",         # For testing your managers and tools
    "ruff>=0.3.0",           # For fast linting and formatting
]